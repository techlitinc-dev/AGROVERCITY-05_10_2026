    max_steps: 32
    goal: "A buyer RFQ for 10MT cumin to Dubai. Quote, win it, arrange the shipment documents, handle the LC terms, and confirm the remittance landed."
    checkpoints: [quote submitted, order confirmed, shipment docs done, LC matched, remittance confirmed]
    tags: [core, trade, money]
    ease_focus: export document steps guided — one missed doc kills a shipment

  - id: exporter-supplier-week
    persona: exporter
    suite: full
    mode: open
    max_steps: 20
    goal: "Review supplier reliability and prices, check the order book, and look at the forex/remittance summary for the quarter."
    tags: [core, analytics]

  - id: exporter-customs-hold
    persona: exporter
    suite: full
    mode: adversarial
    max_steps: 20
    goal: "Shipment held at customs — document mismatch between invoice and packing list. Fix the papers, notify the buyer about the delay, and re-submit."
    tags: [ease, recovery, documents]
    ease_focus: error recovery under deadline pressure with buyer communication


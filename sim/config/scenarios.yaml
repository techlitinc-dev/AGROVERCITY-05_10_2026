    suite: full
    mode: guided
    max_steps: 30
    goal: "List my tractor with rotavator for rent, get it verified, then handle a booking — accept it, arrange the deposit, and see the settlement after work is done."
    checkpoints: [equipment listed, verification done, booking accepted, deposit recorded, settlement seen]
    tags: [core, assets, money]

  - id: equipment-season-prep
    persona: equipmentRental
    suite: full
    mode: open
    max_steps: 20
    goal: "Sowing season near. Check market intel for demand, adjust my day rate, look at last season's ROI, and log a maintenance expense."
    tags: [core, earnings]

  - id: equipment-first-listing
    persona: equipmentRental
    suite: full
    mode: adversarial
    max_steps: 22
    goal: "First time listing online. You don't know what rate to ask and you're worried about damage. List anyway, then a customer disputes a scratch — handle it."
    tags: [ease, trust, dispute]
    ease_focus: pricing guidance and damage-protection clarity at the moment of doubt

  # ══════════════════════ 6. BROKER / DALAL (DealDesk) ══════════════════════
  - id: broker-close-deal
    persona: broker
    suite: full
    mode: guided
    max_steps: 30

    persona: insuranceProvider
    suite: full
    mode: adversarial
    max_steps: 20
    goal: "A rejected claim came back with an appeal and new photos. Re-open it, compare with the original survey, and decide again — and make sure the farmer sees the reason either way."
    tags: [ease, trust, claims]
    ease_focus: appeal loop with visible reasoning — trust lives or dies here


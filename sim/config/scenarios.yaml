    goal: "A donor gave ₹5,000 in cash and wants a proper receipt 'with the gaushala seal, in Hindi' for tax. Issue it, and also fix a duplicate animal record a volunteer created."
    tags: [ease, receipts, hindi]
    ease_focus: receipt language/format and duplicate handling


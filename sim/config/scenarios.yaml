    persona: bankManager
    suite: full
    mode: adversarial
    max_steps: 20
    goal: "An application looks good but KYC documents are blurry and one is missing. You can't approve it as-is. Send it back with exact instructions, and flag a second application that looks fraudulent."
    tags: [ease, compliance, fraud]

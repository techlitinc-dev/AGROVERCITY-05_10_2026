    checkpoints: [lead created/matched, deal opened, milestones advanced, commission recorded]
    tags: [core, trade]

  - id: broker-portfolio-day
    persona: broker
    suite: full
    mode: open
    max_steps: 22
    goal: "Check your trust tier and rating, follow up on two open leads, and look at pending commissions across deals."

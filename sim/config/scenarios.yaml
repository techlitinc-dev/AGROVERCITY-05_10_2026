    mode: adversarial
    max_steps: 18
    goal: "Mid-appointment, an emergency call comes about a calving complication 4 km away. Handle or reschedule the current appointment, record the emergency visit, and don't lose the paperwork."
    tags: [ease, interruption, recovery]
    ease_focus: mid-flow interruptions must not destroy in-progress work


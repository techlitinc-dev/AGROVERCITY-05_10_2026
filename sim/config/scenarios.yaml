  - id: fpo-agm-season
    persona: fpoManager
    suite: full
    mode: open
    max_steps: 18
    goal: "AGM prep: pull the impact and earnings report, check subsidy applications pending, and see member grievances."
    tags: [core, governance]

  - id: fpo-price-disagreement
    persona: fpoManager
    suite: full
    mode: adversarial
    max_steps: 18
    goal: "Two members say the pooled price is lower than the mandi they saw and want their lots back. Check the actual numbers, explain or correct, and handle the exit if they insist."
    tags: [ease, trust, governance]
    ease_focus: transparent pool pricing and a clean exit path keep trust

  # ══════════════════════ 19. WOMEN SHG (Mahila) ══════════════════════
  - id: shg-savings-to-sale
    persona: womenShg
    suite: full
    mode: guided
    max_steps: 30
    goal: "Record this week's savings for 8 members, add a new pickle batch to your gruh-udyog unit, fulfill the order that came in, and check the payout."
    checkpoints: [savings recorded, batch added, order fulfilled, payout visible]
    tags: [core, shg, money]
    ease_focus: shared phone, possibly husband's — privacy and simplicity matter

  - id: shg-loan-request
    persona: womenShg
    suite: full
    mode: open
    max_steps: 20
    goal: "A member asks for a ₹20,000 group loan for a sewing machine. Initiate it, check your SHG's eligibility, and update the savings book."
    tags: [core, finance]

  - id: shg-low-confidence-user
    persona: womenShg
    suite: full
    mode: adversarial
    max_steps: 20
    goal: "You are not comfortable with English apps and you're scared of 'sending money wrong'. Do the savings entry and check the order payment, in Hindi, without help from anyone. If unsure, find help inside the app."
    tags: [ease, language, confidence]
    ease_focus: vernacular UI, reversibility cues, and in-app hand-holding

  # ══════════════════════ 20. NURSERY ══════════════════════
  - id: nursery-fulfill-order
    persona: nursery
    suite: full
    mode: guided
    max_steps: 26
    goal: "Add 50 neem saplings to inventory, confirm and fulfill an incoming order, create a small discount offer for the weekend, and check the payout."
    checkpoints: [inventory added, order confirmed, order fulfilled, offer created, payout visible]
    tags: [core, commerce, money]

  - id: nursery-monsoon-campaign
    persona: nursery
    suite: full
    mode: open
    max_steps: 18
    goal: "Monsoon planting season. Check tree-plantation requests and NGO tie-ups, review ratings, and plan stock for the demand spike."
    tags: [core, season]

  - id: nursery-name-confusion
    persona: nursery
    suite: full
    mode: adversarial
    max_steps: 18
    goal: "A customer ordered 'kadi patta' plants but your catalog lists them under the botanical name and you sent the wrong variety once. Fix the order, fix the listing names so it doesn't repeat."
    tags: [ease, catalog, recovery]
    ease_focus: local-language names alongside botanical names

  # ══════════════════════ MODE E — CHAINS (multi-persona market events) ══════════════════════
  # Chains run SERIALLY in a dedicated shared world (specs §18c).
  # Each step's goal receives the previous steps' created entity ids as CONTEXT.

  - id: chain-wheat-market
    persona: farmer
    suite: full
    mode: chain
    max_steps: 12
    goal: "List 20q wheat for sale at a fair price."
    chain:
      - {persona: seller, goal: "Find that wheat lot and negotiate a deal."}
      - {persona: broker, goal: "Close this deal and record your commission."}
      - {persona: transporter, goal: "Get this load hauled to the buyer."}
      - {persona: bankManager, goal: "Verify the settlement reaches the seller correctly."}
    tags: [chain, trade-seam]

  - id: chain-dairy-morning
    persona: milkSeller
    suite: full
    mode: chain
    max_steps: 12
    goal: "Mark this morning's deliveries to the dairy."
    chain:
      - {persona: dairyManager, goal: "Record the collection and generate today's payment batch."}
      - {persona: seller, goal: "Buy this milk batch for your sweet shop and settle."}
    tags: [chain, dairy-seam]

  - id: chain-equipment-rental
    persona: farmer
    suite: full
    mode: chain
    max_steps: 12
    goal: "Book a tractor+rotavator for 2 days next week."
    chain:
      - {persona: equipmentRental, goal: "Review and accept this booking with a deposit."}
      - {persona: farmer, goal: "Confirm the booking is secured and the money is held safely."}
    tags: [chain, assets-seam]

  - id: chain-produce-delivery
    persona: customer
    suite: full
    mode: chain
    max_steps: 12
    goal: "Order a fruit basket from a farmer storefront."
    chain:
      - {persona: farmer, goal: "You received this order — confirm and pack it."}
      - {persona: transporter, goal: "Deliver this order and complete handover."}
      - {persona: customer, goal: "Track and confirm you received it, then rate."}
    tags: [chain, commerce-seam]

  - id: chain-loan
    persona: farmer
    suite: full
    mode: chain
    max_steps: 12
    goal: "Apply for a ₹1 lakh tractor loan."
    chain:
      - {persona: bankManager, goal: "Underwrite this application and decide."}
      - {persona: farmer, goal: "Check the decision and disbursement status."}
    tags: [chain, finance-seam]

  - id: chain-vet-camp
    persona: gaushalaManager
    suite: full
    mode: chain
    max_steps: 10
    goal: "Set up a vaccination camp at your gaushala next week."
    chain:
      - {persona: vet, goal: "Review the camp plan and confirm your sessions."}
      - {persona: gaushalaManager, goal: "Check registrations and finalize preparations."}
    tags: [chain, health-seam]


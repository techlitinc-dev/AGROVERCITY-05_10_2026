    ease_focus: underwriting decision in one screen with risk evidence attached

  - id: bank-portfolio-review
    persona: bankManager
    suite: full
    mode: open
    max_steps: 20
    goal: "Monday portfolio check: overdue repayments, applications pending too long, KCC renewals due this month, audit trail sample."

    persona: broker
    suite: full
    mode: adversarial
    max_steps: 22
    goal: "A deal is stuck — the seller stopped responding after the rate dropped. Try to move it, and if it fails, close it cleanly and protect your commission record."
    tags: [ease, recovery]
    ease_focus: graceful failure paths and dispute tools when humans flake


# scenarios.yaml — the full persona scenario library
#
# Every persona gets three scenario types:
#   guided      — the persona's core job-to-be-done, happy path, with checkpoints
#   open        — a realistic slice-of-life; agent decides everything
#   adversarial — the USER-FRIENDLINESS probe: low literacy, missing info, errors,
#                 impatience, recovery. This is where "easy" gets proven or disproven.
#
# Plus: chains (Mode E, multi-persona market events), admin sweeps (Mode D),
# and security probes (Mode F).
#
# Fields: id, persona, suite (smoke|full), mode, goal (user voice — keep it plain),
# max_steps, checkpoints (guided only), tags (analyzer grouping), ease_focus
# (what "easy" means in this scenario — surfaces in the report).

scenarios:

  # ══════════════════════ 1. FARMER (Kisan) ══════════════════════
  - id: farmer-sell-wheat
    persona: farmer
    suite: smoke
    mode: guided
    max_steps: 30
    goal: "Sell 20 quintal wheat from my harvest. First check today's mandi price in Anand, then create a lot and respond to any offer."
    checkpoints: [mandi price viewed, lot created with quantity+price, offer received or solicited, lot status live/negotiated]
    tags: [core, trade]
    ease_focus: can a farmer go from price-check to live lot without help?

  - id: farmer-evening-round
    persona: farmer
    suite: full
    mode: open
    max_steps: 25
    goal: "Evening after market. Check mandi prices, write today's farm diary, my cotton crop has leaf spots — use the crop doctor, and see if any government scheme fits me."
    tags: [core, advisory, schemes]

  - id: farmer-low-literacy-sale
    persona: farmer
    suite: full
    mode: adversarial
    max_steps: 25
    goal: "You studied till 5th class. Your phone is your son's old Android. Sell your wheat — you are not sure of the exact weight or the grade, you just know it's good wheat. If something goes wrong, use the chatbot or support."
    tags: [ease, recovery, low-literacy]
    ease_focus: no jargon, forgiving forms, help reachable in 2 taps

  # ══════════════════════ 2. LANDLORD (LandBank) ══════════════════════
  - id: landlord-lease-plot
    persona: farmLandlord
    suite: full
    mode: guided
    max_steps: 30
    goal: "List my 5 acre irrigated plot near Anand for leasing, review the lead that came in, and set up a lease with rent and milestones."
    checkpoints: [plot created, listing live, lead reviewed, lease created with milestones]
    tags: [core, assets]
    ease_focus: landlord is 55; escrow and legal words must not scare him off

  - id: landlord-monthly-check
    persona: farmLandlord
    suite: full
    mode: open
    max_steps: 20
    goal: "Check this month's rent, see profit from my plots, and reply to a tenant who wants to renew early."
    tags: [core, money]

  - id: landlord-suspicious-of-escrow
    persona: farmLandlord
    suite: full
    mode: adversarial
    max_steps: 20
    goal: "You don't trust online payment — 'where is my money actually?' Set up the lease but you want rent straight to your bank, and you will call the broker if it looks complicated. Keep going anyway if you can understand it."
    tags: [ease, trust, money]
    ease_focus: trust cues and simple money language decide completion

  # ══════════════════════ 3. TRANSPORTER (AgriFleet) ══════════════════════
  - id: transporter-run-trip
    persona: transporter
    suite: smoke
    mode: guided
    max_steps: 30
    goal: "Find a load Rajkot to Ahmedabad for my pickup, quote/accept it, run the trip with the OTP handover, and check my wallet after."
    checkpoints: [job found and accepted, trip started, POD OTP handed over, wallet credited]
    tags: [core, logistics, money]
    ease_focus: one-handed, on-road, 2 minutes per interaction

  - id: transporter-slow-day
    persona: transporter
    suite: full
    mode: open
    max_steps: 22
    goal: "Slow morning. Check the job inbox, see my earnings analytics, look for a return load so I don't drive back empty, and note fuel in diary."
    tags: [core, earnings]

  - id: transporter-race-and-recover
    persona: transporter
    suite: full
    mode: adversarial
    max_steps: 22
    goal: "You try to accept a good load but it says just taken by someone else. You get annoyed. Find another load nearby and finish a trip today."
    tags: [ease, recovery, race-condition]
    ease_focus: losing a job must not end the session — alternatives in one tap

  # ══════════════════════ 4. SELLER / VYAPARI (FarmLink) ══════════════════════
  - id: seller-procure-and-sell
    persona: seller
    suite: smoke
    mode: guided
    max_steps: 30
    goal: "Check mandi rates for onion, find a farmer lot worth buying, agree a purchase, then record today's shop sales on the POS."
    checkpoints: [rates viewed, lot shortlisted, purchase agreed, POS sale recorded]
    tags: [core, trade, money]
    ease_focus: a shopkeeper has 2 minutes between customers; every screen counts

  - id: seller-morning-routine
    persona: seller
    suite: full
    mode: open
    max_steps: 22
    goal: "Shop opens. Check yesterday's settlement, see new demands posted, update my rates, check stock."
    tags: [core, money]

  - id: seller-busy-counter
    persona: seller
    suite: full
    mode: adversarial
    max_steps: 22
    goal: "Customers keep coming. Record three quick sales — one cash, one UPI, one on credit to a known buyer — and check your cashflow without losing track."
    tags: [ease, speed, money]
    ease_focus: speed of routine entries; credit must be safe but not slow

  # ══════════════════════ 5. EQUIPMENT RENTAL (MachineBazaar) ══════════════════════
  - id: equipment-list-and-book

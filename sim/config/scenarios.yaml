  - id: bank-loan-pipeline
    persona: bankManager
    suite: smoke
    mode: guided
    max_steps: 30
    goal: "Review a KCC loan application from a farmer with a good profile, approve it, disburse, and verify the repayment schedule exists."
    checkpoints: [application reviewed incl. farmer360, decision recorded, disbursement done, schedule visible]

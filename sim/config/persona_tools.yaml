# Persona → catalog tags allowed in the always-on tool index (specs §6).
# The rest stays reachable via search_tools (which is also a gap-detector).
#
# IMPORTANT: tag names come from your routers' `tags=` params. Print the real
# ones first:   python -m sim.cli catalog --tags
# Then fix this file. Until then, the harness falls back to keyword matching
# (ops whose path/summary contains the persona id or these keywords).
# `admin*` tags are NEVER whitelisted for non-admin personas — enforced in code.


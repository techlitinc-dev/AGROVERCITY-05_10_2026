name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly live golden-set run (phase-08 WS-02) at 02:00 IST (20:30 UTC).
    - cron: "30 20 * * *"

jobs:
  backend:
    name: Backend tests (AI_PROVIDER=shim)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test suite
        env:
          AI_PROVIDER: shim
        run: python -m pytest -q
      - name: Golden suites (shim, every merge)
        env:
          AI_PROVIDER: shim
        run: python -m pytest -q -k golden

  website:
    name: Website typecheck, build & locale parity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests (vitest)
        run: pnpm test
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm build
      - name: Bundle size gate (first-load budget)
        run: node scripts/check-bundle-size.mjs
      - name: Locale parity (en/hi)
        run: node scripts/check-locale-parity.mjs

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan git history for secrets
        run: /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1
